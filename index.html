<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NavalFireVR — Project Control Room</title>
<meta name="description" content="Project control room for NavalFireVR: roadmap, environment checks, equipment lockers, VR interaction planning, and Codex task tracking." />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1c2a'/%3E%3Cpath d='M6 21c4-1 6-4 10-4s6 3 10 4' stroke='%23119c93' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16 7v10M12 11h8' stroke='%23c9871a' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <span class="brand-glyph" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M3 17c3.2-.8 4.9-3 9-3s5.8 2.2 9 3" />
            <path d="M12 4v8M9 7.5h6" />
            <circle cx="12" cy="12" r="0.9" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <div>
          <div class="brand-name">Naval<span>Fire</span>VR</div>
          <div class="brand-sub">Project control room</div>
        </div>
      </div>
    </div>

    <nav class="nav" aria-label="Sections">
      <div class="nav-label">Command</div>
      <button class="nav-item" data-route="overview">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7.5" height="7.5" rx="1.4"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.4"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.4"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.4"/></svg></span>
        <span class="nav-text">Overview</span>
        <span class="nav-count" data-count="open">0</span>
      </button>
      <button class="nav-item" data-route="roadmap">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 3v18"/><circle cx="6" cy="7" r="2.2"/><circle cx="6" cy="17" r="2.2"/><path d="M11 7h8M11 17h6"/></svg></span>
        <span class="nav-text">Roadmap</span>
        <span class="nav-count" data-count="milestones">0</span>
      </button>

      <div class="nav-label">Systems</div>
      <button class="nav-item" data-route="environment">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span>
        <span class="nav-text">Environment</span>
        <span class="nav-count" data-count="env">0</span>
      </button>
      <button class="nav-item" data-route="lockers">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M12 4v16M7.5 11h1M15.5 11h1"/></svg></span>
        <span class="nav-text">Equipment lockers</span>
        <span class="nav-count" data-count="lockers">0</span>
      </button>
      <button class="nav-item" data-route="interactions">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 11V6.5a1.5 1.5 0 013 0V11"/><path d="M11 10V5.5a1.5 1.5 0 013 0V11"/><path d="M14 10.5V7a1.5 1.5 0 013 0v7a6 6 0 01-6 6h-1a5 5 0 01-4-2l-3-4a1.6 1.6 0 012.4-2l1.6 2"/></svg></span>
        <span class="nav-text">VR interactions</span>
        <span class="nav-count" data-count="interactions">0</span>
      </button>

      <div class="nav-label">Investigation</div>
      <button class="nav-item" data-route="plan">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h3M4 12h3M4 18h3"/><path d="M10 6h10M10 12h10M10 18h10"/></svg></span>
        <span class="nav-text">Completion plan</span>
        <span class="nav-count" data-count="plan">0</span>
      </button>
      <button class="nav-item" data-route="graphics">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span>
        <span class="nav-text">Graphics &amp; headset</span>
        <span class="nav-count" data-count="graphics">0</span>
      </button>
      <button class="nav-item" data-route="tasks">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h9M9 12h9M9 19h9"/><path d="M4 5l1.4 1.4L8 3.8M4 12l1.4 1.4L8 10.8M4 19l1.4 1.4L8 17.8"/></svg></span>
        <span class="nav-text">Codex tasks</span>
        <span class="nav-count" data-count="tasks">0</span>
      </button>

      <div class="nav-label">Knowledge</div>
      <button class="nav-item" data-route="gallery">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5L5 20"/></svg></span>
        <span class="nav-text">Project gallery</span>
      </button>
      <button class="nav-item" data-route="vault">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 016.5 3H19v18H6.5A2.5 2.5 0 014 18.5z"/><path d="M4 18.5A2.5 2.5 0 016.5 16H19"/></svg></span>
        <span class="nav-text">Vault notes</span>
        <span class="nav-count" data-count="vault">0</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="row"><span>PROJECT</span><strong>NavalFireVR</strong></div>
      <div class="row"><span>SEEDED</span><strong id="foot-seeded">—</strong></div>
      <div class="row"><span>LAST SAVE</span><strong id="foot-saved">not yet</strong></div>
      <div class="row"><span>STORAGE</span><strong id="foot-storage">local</strong></div>
    </div>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div>
        <div class="topbar-eyebrow" id="page-eyebrow">NavalFireVR / Control room</div>
        <h1 id="page-title">Overview</h1>
        <p class="topbar-sub" id="page-sub">Current state of the project.</p>
      </div>
      <div class="topbar-actions">
        <span class="saved-pill" id="saved-pill" title="Changes are saved in this browser">
          <span class="saved-dot"></span><span id="saved-text">Saved</span>
        </span>
        <button class="btn" id="btn-export" title="Download the current state as JSON">Export</button>
        <button class="btn" id="btn-import" title="Load a previously exported JSON file">Import</button>
        <input type="file" id="file-import" accept="application/json,.json" hidden />
        <button class="btn btn--danger" id="btn-reset" title="Restore the recorded project state">Reset</button>
      </div>
    </header>

    <div class="page" id="page"></div>
  </main>
</div>

<div class="drawer-overlay" id="drawer-overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Editor"></aside>
<div class="lightbox" id="lightbox" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="vault-data.js"></script>
<script src="app.js"></script>
</body>
</html>
